/* Layout: ledger-style dashboard. Sticky top bar + bottom nav on phones, left nav on desktop. Money always in tabular figures. */
:root{
  --bg:#f3f6f4; --card:#ffffff; --fg:#14211c; --muted:#5d6b65; --line:#d9e1dd; --line-strong:#b9c6c0;
  --accent:#0f5c4a; --accent-fg:#ffffff; --accent-soft:#dfeee8;
  --good:#1f7a4d; --warn:#b4700d; --bad:#b3302f; --good-soft:#dff2e6; --warn-soft:#fbeed4; --bad-soft:#f8dedd;

  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(20,33,28,.06),0 6px 18px -8px rgba(20,33,28,.14);
}

  --good:#5fcf8f; --warn:#e5a84c; --bad:#ef7a78; --good-soft:#163b27; --warn-soft:#3d2d10; --bad-soft:#44201f;

  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1512; --card:#172019; --fg:#e8efeb; --muted:#9aaba3; --line:#26332d; --line-strong:#3a4b43;
  --accent:#4fbf9a; --accent-fg:#06110d; --accent-soft:#163329;
  --good:#5fcf8f; --warn:#e5a84c; --bad:#ef7a78; --good-soft:#163b27; --warn-soft:#3d2d10; --bad-soft:#44201f;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:20px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
.num,td.num,th.num,.money{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:12px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hide{display:none!important}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.topbar .brand span.k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent-fg);color:var(--accent);font-size:15px}
.topbar .spacer{flex:1}
.topbar .who{font-size:12px;opacity:.9;display:flex;align-items:center;gap:8px}
.topbar button{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.sync{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on{background:var(--good)}

/* shell */
.shell{display:grid;grid-template-columns:200px 1fr;min-height:calc(100% - 46px)}
nav.side{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
nav.side button,nav.bottom button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 12px;font-weight:600;color:var(--muted)}
nav.side button.on{background:var(--accent-soft);color:var(--accent)}
nav.side svg,nav.bottom svg{width:18px;height:18px;flex:none}
main{padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1180px;width:100%}
nav.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));overflow-x:auto;-webkit-overflow-scrolling:touch;gap:2px}
nav.bottom button{flex:0 0 66px;width:66px}
nav.bottom button{flex-direction:column;gap:3px;font-size:9px;padding:6px 1px;justify-content:center;text-align:center}
nav.bottom button.on{color:var(--accent)}
@media (max-width:860px){ .brand .small{display:none} .shell{grid-template-columns:1fr} nav.side{display:none} nav.bottom{display:flex} main{padding-block:14px 96px} }

/* cards + grids */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .g2,.g3,.g4{grid-template-columns:1fr} .g4.tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-bottom:8px}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.tile.hero .lbl,.tile.hero .sub{color:inherit;opacity:.85}
.tile.hero.neg{background:var(--bad)}
.stripe{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.stripe i{display:block;height:100%;background:var(--accent)}

.section{display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .spacer{flex:1}
select,input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],textarea{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
input[type=file]{max-width:100%}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:9px;padding:8px 14px;font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--accent-soft);color:var(--accent)}

/* tables */
.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.bulk select{font-size:12px;padding:4px 6px}
td input.pick{width:16px;height:16px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;border-top:2px solid var(--line-strong)}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--accent)} th.sorted{color:var(--accent)} th.sortable::after{content:attr(data-dir);margin-left:4px;font-size:9px}
tr.filters th{padding:2px 4px;border-bottom:1px solid var(--line)} tr.filters input{width:100%;min-width:60px;padding:3px 6px;font-size:11px;border-radius:6px;font-weight:400;text-transform:none;letter-spacing:0}
tr.sub td{color:var(--muted)}
td select,td input{padding:4px 6px;font-size:12px;border-radius:6px}
td input.note{width:100%;min-width:140px}

.payee{font-weight:600}
.ref{color:var(--muted);font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* charts */
.chartbox{position:relative;height:260px;min-width:0}
.chartbox.tall{height:320px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* insights */
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .mark{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.insight .mark.warn{background:var(--warn)} .insight .mark.bad{background:var(--bad)} .insight .mark.good{background:var(--good)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.login .box{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.login .logo{display:flex;align-items:center;gap:10px}
.login .logo span.k{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:800;font-size:20px}
.login label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.login input,.login select{padding:10px 12px;font-size:16px}
.login .err{color:var(--bad);font-size:13px;min-height:18px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}

.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.acct-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.acct-tabs button{flex:none;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--muted);text-align:left}

.acct-tabs button small{display:block;font-size:10px;font-weight:500;opacity:.8}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}

// Kawa Budget Platform – statement parsers (shared between Node extraction and the browser app)
// Input: pages = [ [ {y, items:[{s,x,y,w}] } ... ] ... ]  (lines sorted top→bottom, items left→right)
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const num = s => {
    const m = String(s).replace(/[£,\s]/g, '').match(/^-?\d+(\.\d{1,2})?$/);
    return m ? parseFloat(m[0]) : null;
  };
  const isAmt = s => num(s) !== null && /\d\.\d{2}$/.test(String(s).replace(/[£,\s]/g, ''));
  const txt = line => line.items.map(i => i.s).join(' ');
  const allText = pages => pages.map(ls => ls.map(txt).join('\n')).join('\n');
  const right = it => it.x + (it.w || 0);
  const round2 = v => Math.round(v * 100) / 100;

  function mkTx(acc, date, desc, amount, kind, extra) {
    return Object.assign({ account: acc, date, desc: desc.replace(/\s+/g, ' ').trim(), amount: round2(amount), kind }, extra || {});
  }

  // ---------- Metro Bank (Thinc Business) ----------
  function parseMetro(pages) {
    const all = allText(pages);
    const acct = (all.match(/Business Bank Account number\s+(\d{8})/) || [])[1];
    const period = all.match(/From:\s+(\d{2} [A-Z]{3} \d{4})\s+To:\s+(\d{2} [A-Z]{3} \d{4})/);

        const first = line.items[0];

        name = (body[0] || '').replace(/\s+\d{9,}$/, '').trim();
        tx.txDate = m[2];
        if (body[1]) tx.location = body[1];
      } else if ((m = head.match(/^Direct Debit (.+)$/))) name = m[1];
      else if ((m = head.match(/^Standing Order (.+)$/))) { name = m[1]; if (body[0]) tx.ref = body[0]; }
      else if ((m = head.match(/^Outward Faster Payment (.+)$/))) {
        name = m[1];
        // continuation of payee name (not a bank line / reference)
        if (body[0] && !/BANK|PLC|LTD|LIMITED|MONZO|REVOLUT|WISE|CLEARBANK|HALIFAX|NATIONWIDE|VIRGIN|BARCLAYS|LLOYDS|HSBC|SCTY/i.test(body[0]) && body.length > 1) { name += ' ' + body[0]; body.shift(); }
        if (body[0]) tx.bank = body[0];
        if (body[1]) tx.ref = body[1];
      } else if ((m = head.match(/^Account to Account Transfer (.+)$/))) { name = m[1]; if (body[0]) tx.ref = body[0]; }
      else if ((m = head.match(/^Inward Payment$/))) { name = body[0] || 'Inward Payment'; if (body[1]) tx.ref = body[1]; }
      else if (/^Non-Sterling Transaction Fee/.test(head)) name = 'Non-Sterling Transaction Fee';
      tx.payee = name.replace(/\s+/g, ' ').trim();
      tx.desc = [tx.payee, tx.ref].filter(Boolean).join(' · ');
      delete tx.lines;
    }
    return { account: 'thinc', bank: 'Metro Bank', acctNo: acct, period: period ? [period[1], period[2]] : null, summary, transactions: txs };
  }

  // ---------- Revolut Business (One Holidays) ----------
  function parseRevolut(pages) {
    const txs = [];
    let cur = null;
    for (const lines of pages) {
      for (const line of lines) {
        const first = line.items[0];
        const dm = first.s.match(/^(\d{1,2}) ([A-Za-z]{3,4}) (\d{4})$/);
        if (dm && first.x < 60 && line.items.length > 3) {
          const date = iso(+dm[3], MONTHS[dm[2].toLowerCase()], +dm[1]);
          const code = line.items[1].s;
          const desc = line.items.slice(2).filter(i => i.x < 360).map(i => i.s).join(' ');
          const amts = line.items.filter(i => i.x > 460 && isAmt(i.s));
          let amount = 0;
          for (const a of amts) { const v = num(a.s); amount = (a.x >= 510 || right(a) > 548) ? v : -v; }
          let kind = 'card';
          if (code === 'MOA' || code === 'MOR') kind = 'credit';
          else if (code === 'MOS') kind = 'payment';
          else if (code === 'FEE') kind = 'fee';
          let payee = desc.replace(/^Money added from /i, '').replace(/^From /i, '').replace(/^To /i, '');
          let ref = null;
          const parts = payee.split(' • ');
          if (parts.length > 1) { payee = parts[0]; ref = parts.slice(1).join(' • '); }
          cur = mkTx('oneholidays', date, desc, amount, kind, { payee: payee.trim(), ref, code });
          txs.push(cur);
        } else if (cur && /^Fee: £/.test(first.s)) {
          cur.fee = num(first.s.replace('Fee: ', ''));
        }
      }
    }
    const all = allText(pages);
    const period = all.match(/Transactions from (.+?) to (.+?)\n/);
    return { account: 'oneholidays', bank: 'Revolut Business', acctNo: null, period: period ? [period[1], period[2]] : null, summary: {}, transactions: txs };
  }

  // ---------- HSBC personal ----------
  function parseHSBC(pages) {
    const all = allText(pages);
    const acct = (all.match(/\d{2}-\d{2}-\d{2}\s+(\d{8})/) || [])[1];
    const nameM = all.match(/Account Nam e[\s\S]*?\n([^\n]*?)\s+\d{2}-\d{2}-\d{2}/);
    const holder = nameM ? nameM[1].trim() : '';
    const accId = /louise|hadi/i.test(holder) ? 'louise_hsbc' : 'ajay_hsbc';
    const summary = {
      opening: num((all.match(/Ope ?ning Balance\s+£([\d,.]+)/) || [])[1]),
      moneyIn: num((all.match(/Paym ?e ?nts In\s+£([\d,.]+)/) || [])[1]),
      moneyOut: num((all.match(/Paym ?e ?nts Out\s+£([\d,.]+)/) || [])[1]),
      closing: num((all.match(/Clos ?ing Balance\s+£([\d,.]+)/) || [])[1]),
    };
    const periodM = all.match(/(\d{1,2} [A-Z][a-z]+) to (\d{1,2} [A-Z][a-z]+ \d{4})/);
    const txs = [];
    let cur = null, curDate = null, inTable = false;
    for (const lines of pages) {
      for (const line of lines) {
        const t = txt(line);
        if (/^Date\s+Pay/.test(t)) { inTable = true; continue; }
        if (!inTable) continue;
        if (/BALANCE CARRIED FORWARD/.test(t) || /Information about the Financial/.test(t)) { inTable = false; cur = null; continue; }
        if (/BALANCE BROUGHT FORWARD/.test(t)) continue;
        let items = line.items.slice();
        const first = items[0];
        const dm = first.s.match(/^(\d{2}) ([A-Z][a-z]{2}) (\d{2})$/);
        if (dm && first.x < 70) { curDate = iso(2000 + +dm[3], MONTHS[dm[2].toLowerCase()], +dm[1]); items.shift(); }
        if (!items.length) continue;
        const codeItem = items[0];
        const amts = items.filter(i => isAmt(i.s) && i.x > 340);
        const words = items.filter(i => !(isAmt(i.s) && i.x > 340));
        if (codeItem.x > 100 && codeItem.x < 130 && /^(\)\)\)|DD|SO|VIS|CR|BP|TFR|ATM|CHQ|DR|CHG|INT|STO|OTH)$/.test(codeItem.s)) {
          const code = codeItem.s;
          const kind = code === 'DD' ? 'DD' : code === 'SO' ? 'SO' : code === 'CR' ? 'credit' : code === 'BP' ? 'payment' : 'card';
          cur = mkTx(accId, curDate, words.slice(1).map(i => i.s).join(' '), 0, kind, { code, lines: [] });
          txs.push(cur);
        } else if (cur && codeItem.x >= 130 && codeItem.x < 200) {
          cur.lines.push(words.map(i => i.s).join(' '));
        }
        if (cur && amts.length) {
          for (const a of amts) {
            const v = num(a.s);
            if (a.x < 420) cur.amount = -v; else if (a.x < 495) cur.amount = v; else cur.balance = v;
          }
        }
      }
    }
    for (const tx of txs) {
      tx.payee = tx.desc.trim();
      if (/^INT'L \d+$/.test(tx.payee) && tx.lines.length) { tx.payee = tx.lines.shift().replace(/\s+(AED|USD|EUR|INR)\s[\d,.]+ @.*$/, '').trim(); }
      if (/^Non-Sterling$/i.test(tx.payee)) tx.payee = 'Non-Sterling Transaction Fee';
      if (tx.lines.length) tx.ref = tx.lines.join(' ');
      tx.desc = [tx.payee, tx.ref].filter(Boolean).join(' · ');
      delete tx.lines;
    }
    return { account: accId, bank: 'HSBC UK', acctNo: acct, holder, period: periodM ? [periodM[1], periodM[2]] : null, summary, transactions: txs };
  }

  // ---------- Virgin Money (Louise) ----------
  function parseVirgin(pages) {
    const all = allText(pages);
    const acct = (all.match(/Account number\s*\n?\s*(\d{8})/) || [])[1];
    const stDate = all.match(/Statement date\s*\n?\s*(\d{1,2} [A-Z][a-z]+ \d{4})/);
    const summary = {
      opening: num((all.match(/Opening ?balance\s*£([\d,.]+)/) || [])[1]),
      moneyOut: num((all.match(/Debits\s*£([\d,.]+)/) || [])[1]),
      moneyIn: num((all.match(/Credits\s*£([\d,.]+)/) || [])[1]),
      closing: num((all.match(/Closing ?balance\s*£([\d,.]+)/) || [])[1]),
    };
    // year: from statement date; the statement is the previous month usually – use first "01 Sep 2026" style line
    const firstDate = all.match(/(\d{2}) ([A-Z][a-z]{2}) (\d{4})\s+Previous ?statement/);
    let year = firstDate ? +firstDate[3] : (stDate ? +stDate[1].slice(-4) : new Date().getFullYear());
    let lastMonth = firstDate ? MONTHS[firstDate[2].toLowerCase()] : 1;
    const vAcc = acct === '40316734' ? 'virgin_savings' : 'louise_virgin';
    const txs = [];
    let cur = null, curDate = null, inTable = false;
    for (const lines of pages) {
      for (const line of lines) {
        const items = line.items.filter(i => i.x < 430 && i.x >= 40); // drop sidebar + print footer
        if (!items.length) continue;
        const t = items.map(i => i.s).join(' ');
        if (/^Date\s+Description\s+Debits/.test(t)) { inTable = true; continue; }
        if (!inTable) continue;
        if (/Have a think|Nationwide Building|Gross Interest.*\d/.test(t) && !/^Gross Interest/.test(t)) { inTable = false; continue; }
        if (/Have a think|Nationwide Building/.test(t)) { inTable = false; continue; }
        if (/Previous ?statement|Balance brought forward|To make sure|Money Branch|Credit facilities|VM46702/.test(t)) continue;
        let rest = items.slice();
        const first = rest[0];
        const dm = first.s.match(/^(\d{1,2}) ?([A-Z][a-z]{2})$/) || first.s.match(/^(\d{1,2}) ?([A-Z][a-z]{2}) \d{4}$/);
        if (dm && first.x < 80) {
          const m = MONTHS[dm[2].toLowerCase()];
          if (m < lastMonth) year += 1;
          lastMonth = m;
          curDate = iso(year, m, +dm[1]);
          rest.shift();
          cur = null;
        }
        const amts = rest.filter(i => isAmt(i.s) && i.x > 250);
        const words = rest.filter(i => !(isAmt(i.s) && i.x > 250) && i.x < 250);
        let code = null;
        if (words.length && /^(DD|SO)$/.test(words[0].s) && words[0].x < 118) { code = words.shift().s; }
        const wtext = words.map(i => i.s).join(' ');
        if (wtext && (!cur || cur.done)) {
          cur = mkTx(vAcc, curDate, wtext, 0, code === 'DD' ? 'DD' : code === 'SO' ? 'SO' : 'card', { lines: [] });
          txs.push(cur);
        } else if (wtext && cur) cur.lines.push(wtext);
        if (cur && amts.length) {
          for (const a of amts) {
            const v = num(a.s);
            if (a.x < 305) cur.amount = -v; else if (a.x < 360) cur.amount = v; else cur.balance = v;
          }
          if (cur.amount) cur.done = true;
        }
      }
    }
    for (const tx of txs) {
      let name = [tx.desc].concat(tx.lines).join(' ');
      name = name.replace(/\b\d{14}\b/g, '').replace(/^(Wlt57|Autbk57|Card 57|Mb) ?/i, (m) => m.trim() === 'Mb' ? 'Transfer ' : '').replace(/\s+/g, ' ').trim();
      if (/^Mb 821970/i.test(tx.desc) || /821970 40316734/.test(name)) { name = 'Virgin Savings (…6734) transfer'; tx.kind = 'transfer'; }
      if (/^Gross Interest/i.test(name)) tx.kind = 'credit';
      if (/Thinc Business Ltd/i.test(name)) { tx.kind = 'credit'; name = 'Thinc Business Ltd ' + (tx.lines[0] || ''); }
      if (/One Holidays/i.test(name)) { tx.kind = 'credit'; name = 'One Holidays Limited'; }
      if (/^Transfer /.test(name)) tx.kind = 'payment';
      tx.payee = name.trim();
      tx.desc = tx.payee;
      delete tx.lines; delete tx.done;
    }
    return { account: vAcc, bank: 'Virgin Money', acctNo: acct, period: stDate ? [null, stDate[1]] : null, summary, transactions: txs };
  }

  // ---------- Zable credit card ----------
  function parseZable(pages) {
    const all = allText(pages);
    const per = all.match(/statement\s+(\d{1,2}) ([A-Z][a-z]+) (\d{4}) - (\d{1,2}) ([A-Z][a-z]+) (\d{4})/);
    const endYear = per ? +per[6] : new Date().getFullYear();
    const endMonth = per ? MONTHS[per[5].toLowerCase().slice(0, 3)] : 12;
    const summary = {
      previous: num((all.match(/Previous Balance[^£]*£([\d,.]+)/) || [])[1]),
      payments: num((all.match(/Payments since\s+-?£([\d,.]+)/) || [])[1]),
      newTx: num((all.match(/New transactions\s+£([\d,.]+)/) || [])[1]),
      interest: num((all.match(/Interest \([^)]*\)\s+£([\d,.]+)/) || [])[1]),
      closing: num((all.match(/Your new balance\s+£([\d,.]+)/) || [])[1]),
      limit: num((all.match(/Your credit limit\s+£([\d,.]+)/) || [])[1]),
      minPayment: num((all.match(/Minimum Payment Amount[\s\S]*?£([\d,.]+)/) || [])[1]),
    };
    const dueDate = (all.match(/Due date\s+(\d{1,2} [A-Z][a-z]+ \d{4})/) || [])[1];
    const interestDate = (all.match(/Interest \(([^)]*)\)/) || [])[1];
    const txs = [];
    const seen = [];
    for (const lines of pages) {
      for (const line of lines) {
        // split into left/right columns
        const cols = [line.items.filter(i => i.x < 340), line.items.filter(i => i.x >= 340)];
        for (const col of cols) {
          if (!col.length) continue;
          const dm = col[0].s.match(/^[A-Z][a-z]{2} (\d{2}) ([A-Z][a-z]{2})$/);
          if (!dm) continue;
          const amtIt = col.filter(i => isAmt(i.s)).pop();
          if (!amtIt) continue;
          const desc = col.slice(1).filter(i => i !== amtIt).map(i => i.s).join(' ').replace(/\s+/g, ' ');
          const m = MONTHS[dm[2].toLowerCase()];
          const year = m > endMonth ? endYear - 1 : endYear;
          const v = num(amtIt.s);
          const isPay = /^Repayment|Payment/i.test(desc);
          txs.push(mkTx('zable', iso(year, m, +dm[1]), desc, isPay ? v : -v, isPay ? 'payment' : 'card', { payee: desc }));
        }
      }
    }
    if (summary.interest && interestDate) {
      const d = interestDate.match(/(\d{1,2}) ([A-Z][a-z]+)/);
      if (d) txs.push(mkTx('zable', iso(endYear, MONTHS[d[2].toLowerCase().slice(0, 3)], +d[1]), 'Interest charged', -summary.interest, 'interest', { payee: 'Zable interest' }));
    }
    return { account: 'zable', bank: 'Zable', acctNo: null, period: per ? [`${per[1]} ${per[2]} ${per[3]}`, `${per[4]} ${per[5]} ${per[6]}`] : null, summary: Object.assign(summary, { dueDate }), transactions: txs };
  }

  // ---------- Capital One credit card ----------
  function parseCapitalOne(pages) {
    const all = allText(pages);
    const st = all.match(/Statement date\s+(\d{1,2}) ([A-Z][a-z]+) (\d{2})/);
    const endYear = st ? 2000 + +st[3] : new Date().getFullYear();
    const endMonth = st ? MONTHS[st[2].toLowerCase().slice(0, 3)] : 12;
    const acct = (all.match(/\*{4} \*{4} \*{4} (\d{4})/) || [])[1];
    const summary = {
      limit: num((all.match(/Credit limit\s+£([\d,.]+)/) || [])[1]),
      previous: num((all.match(/Previous balance\s+£([\d,.]+)/) || [])[1]),
      payments: num((all.match(/Payments received\s+£([\d,.]+)/) || [])[1]),
      newTx: num((all.match(/New transactions\s+£([\d,.]+)/) || [])[1]),
      closing: num((all.match(/Your new balance\s+£([\d,.]+)/) || [])[1]),
      minPayment: num((all.match(/minimum payment\s*\n?\s*is\s+£([\d,.]+)/) || [])[1]),
      dueDate: (all.match(/It's due on\s+(\d{1,2} [A-Z][a-z]{2} \d{2})/) || [])[1],
      ddAmount: num((all.match(/Direct Debit payment of\s*\n?\s*£([\d,.]+)/) || [])[1]),
    };
    const txs = [];
    let inTable = false;
    for (const lines of pages) {
      for (const line of lines) {
        const t = txt(line);
        if (/Your transaction details/.test(t)) { inTable = true; continue; }
        if (!inTable) continue;
        if (/STATEMENT TOTALS|continued on next page/.test(t)) { inTable = false; continue; }
        const first = line.items[0];
        const dm = first.s.match(/^(\d{2}) ([A-Z][a-z]{2})$/);
        if (!dm || first.x > 60) continue;
        const amts = line.items.filter(i => isAmt(i.s) && i.x > 290);
        if (!amts.length) continue;
        const words = line.items.slice(1).filter(i => !(isAmt(i.s) && i.x > 290));
        const m = MONTHS[dm[2].toLowerCase()];
        const year = m > endMonth ? endYear - 1 : endYear;
        const a = amts[amts.length - 1];
        const v = num(a.s);
        const paidIn = a.x < 340;
        const payee = words[0] ? words[0].s : '';
        const ref = words.slice(1).map(i => i.s).join(' ');
        let kind = paidIn ? 'payment' : 'card';
        if (/Interest/i.test(payee)) kind = 'interest';
        txs.push(mkTx('capitalone', iso(year, m, +dm[1]), [payee, ref].filter(Boolean).join(' · '), paidIn ? v : -v, kind, { payee: kind === 'interest' ? 'Capital One interest' : payee.replace(/ -- Thank You| - Thank You/i, '').trim(), ref }));
      }
    }
    return { account: 'capitalone', bank: 'Capital One', acctNo: acct, period: st ? [null, `${st[1]} ${st[2]} 20${st[3]}`] : null, summary, transactions: txs };
  }

  function detect(pages) {
    const all = allText(pages.slice(0, 2));
    if (/Metro Bank|metrobank|MYMBGB2L/i.test(all)) return 'metro';
    if (/Revolut Business|Revolut Bank UK/i.test(all)) return 'revolut';
    if (/HSBC UK|HBUKGB/i.test(all)) return 'hsbc';
    if (/Virgin Money|CLYDGB/i.test(all)) return 'virgin';
    if (/Zable|Lendable|Credit Agreement Date|Recommended Payment Amount/i.test(all)) return 'zable';
    if (/Capital ?One|capitalone\.co\.uk/i.test(all)) return 'capitalone';
    return null;
  }

  function parse(pages, hint) {
    const kind = hint || detect(pages);
    const fn = { metro: parseMetro, revolut: parseRevolut, hsbc: parseHSBC, virgin: parseVirgin, zable: parseZable, capitalone: parseCapitalOne }[kind];
    if (!fn) throw new Error('Unrecognised statement format');
    const res = fn(pages);
    res.format = kind;
    for (const tx of res.transactions) { if (!tx.payee) tx.payee = tx.desc; }
    return res;
  }

  // Build line structure from pdf.js text items (works in browser and Node)
  function linesFromItems(items) {
    const its = items.filter(i => i.str && i.str.trim() !== '').map(i => ({ s: i.str, x: Math.round(i.transform[4] * 10) / 10, y: Math.round(i.transform[5] * 10) / 10, w: i.width }));
    its.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of its) {
      const last = lines[lines.length - 1];
      if (last && Math.abs(last.y - it.y) <= 2.5) last.items.push(it); else lines.push({ y: it.y, items: [it] });
    }
    for (const l of lines) l.items.sort((a, b) => a.x - b.x);
    return lines;
  }

  return { parse, detect, linesFromItems, MONTHS };
});

function ruleFor(tx) {

async function persistUploads(groups) { // groups: {key:[rows]}
  if (!dbUploads) return;
  for (const [key, rows] of Object.entries(groups)) {
    try { const snap = await dbUploads.doc(key).get(); const prev = snap.exists ? (snap.data().rows || []) : []; const map = Object.fromEntries(prev.map(r => [r.id, r])); for (const r of rows) map[r.id] = r; await dbUploads.doc(key).set({ rows: Object.values(map), updatedAt: Date.now() }); } catch (e) { setSync(false); }

async function connectDb() {
  if (!window.claude || !window.claude.use) return;

      if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
        const tx = state.tx; state = Object.assign(state, remote, { tx, settings: Object.assign({}, DEFAULT_SETTINGS, remote.settings || {}) }); ensureState(); saveLocal(); render();
      }

/* ---------------- derived data ---------------- */
function allTx() {
  const rows = SEED.tx.concat(Object.values(state.tx));
  for (const b of state.bills) rows.push({ id: b.id, a: b.account || 'manual', d: b.date, p: b.payee, v: -Math.abs(b.amount), k: b.recurring ? 'DD' : 'bill', r: b.note || '', manual: true, cat: b.category, type: b.type || (b.recurring ? 'regular' : 'unexpected'), exp: !!b.exp, from: b.from, claimed: b.claimed, receipt: !!b.receipt });
  return rows.map(t => {
    const o = state.over[t.id] || {};
    const rule = ruleFor(t);
    const pk = payeeKey(t.p);
    const cat = o.c || (t.cat) || state.payeeCat[pk] || rule.cat;
    const g = catGroup(cat);
    let type = o.t || (state.payeeType || {})[pk] || t.type;
    if (!type) { if (state.notRecurring[pk]) type = 'everyday'; else if (rule.flags.includes('r') || t.k === 'DD' || t.k === 'SO') type = 'regular'; else if (rule.flags.includes('o') || ((g === 'variable' || g === 'fixed') && Math.abs(t.v) >= 150)) type = 'oneoff'; else type = 'everyday'; }
    const recurring = type === 'regular'; const oneoff = type === 'oneoff' || type === 'unexpected';
    const pe = (state.payeeExp || {})[pk] || {};
    const exp = o.exp != null ? o.exp : (t.exp != null ? t.exp : (pe.exp != null ? pe.exp : rule.flags.includes('x')));
    const claimFrom = o.from || t.from || pe.from || (rule.flags.includes('x') ? state.settings.claimFrom[0] : '');
    const ess = o.ess != null ? o.ess : ((state.payeeEss || {})[pk] != null ? state.payeeEss[pk] : !OPTIONAL_CATS.includes(cat));
    const act = (state.actions || []).find(x => x.key === t.a + '|' + pk);
    return Object.assign({}, t, { cat, pk, note: o.n || state.payeeNote[pk] || '', type, recurring, oneoff, ess, exp: !!exp && t.v < 0, claimFrom, claimed: o.claimed || t.claimed || null, action: act || null, group: catGroup(cat), m: monthOf(t.d) });
  }).sort((a, b) => b.d.localeCompare(a.d) || a.a.localeCompare(b.a));
}
function months() { const c = {}; for (const t of allTx()) c[t.m] = (c[t.m] || 0) + 1; return Object.keys(c).filter(m => c[m] >= 5).sort(); }
function coverageFor(acc, ym) {
  const cov = SEED.coverage.filter(c => c.account === acc);
  const hits = allTx().filter(t => t.a === acc && t.m === ym);
  if (!hits.length) return null;
  const days = hits.map(t => dayOf(t.d));
  return { first: Math.min(...days), last: Math.max(...days), n: hits.length, cov };
}
function summary(ym) {
  const tx = allTx().filter(t => t.m === ym);
  const sum = f => r2(tx.filter(f).reduce((a, t) => a + t.v, 0));
  const income = sum(t => t.cat === 'Income');
  const incomeOne = sum(t => t.cat === 'Income (one-off)');
  const spend = t => t.group !== 'transfer' && t.group !== 'income' && t.group !== 'bnpl';
  const fixed = -sum(t => spend(t) && t.recurring && !t.oneoff);
  const bnpl = -sum(t => t.group === 'bnpl');
  const variable = -sum(t => spend(t) && !t.recurring && !t.oneoff);
  const oneoffs = -sum(t => spend(t) && t.oneoff);
  const vat = state.settings.vat || 0;
  const reclaim = -sum(t => t.exp && !t.claimed);
  const optional = -sum(t => spend(t) && !t.ess && t.v < 0);
  const out = r2(fixed + bnpl + variable + oneoffs + vat);
  const spare = r2(income - out);
  const byCat = {};
  for (const t of tx) if (t.group !== 'transfer' && t.group !== 'income') byCat[t.cat] = r2((byCat[t.cat] || 0) - t.v);
  const byAcc = {};
  for (const t of tx) if (t.group !== 'transfer' && t.v < 0) byAcc[t.a] = r2((byAcc[t.a] || 0) - t.v);
  const byPayee = {};
  for (const t of tx) if (t.group !== 'transfer' && t.group !== 'income' && t.v < 0) byPayee[t.pk] = r2((byPayee[t.pk] || 0) - t.v);
  return { ym, tx, income, incomeOne, fixed, bnpl, variable, oneoffs, vat, out, spare, reclaim, optional, byCat, byAcc, byPayee, expected: (state.settings.incomeThinc || 0) + (state.settings.incomeOneHolidays || 0) };
}
/* fixed cost register: one row per recurring payee */
function fixedRegister() {
  const tx = allTx().filter(t => t.recurring && t.v < 0 && t.group !== 'transfer');
  const byKey = {};
  for (const t of tx) { const k = t.a + '|' + t.pk; (byKey[k] = byKey[k] || { key: k, pk: t.pk, acc: t.a, payee: t.p, cat: t.cat, kind: t.k, months: {}, last: null, note: t.note }); const b = byKey[k]; b.months[t.m] = r2((b.months[t.m] || 0) - t.v); if (!b.last || t.d > b.last.d) b.last = t; }
  const rows = Object.values(byKey).map(b => { const ms = Object.keys(b.months).sort(); const latest = ms[ms.length - 1]; return Object.assign(b, { day: dayOf(b.last.d), amount: b.months[latest], latestMonth: latest, confirmed: ms.length >= 2 || b.kind === 'DD' || b.kind === 'SO', kindLabel: b.kind === 'DD' ? 'Direct Debit' : b.kind === 'SO' ? 'Standing Order' : (b.kind === 'card' ? 'Card / subscription' : b.kind === 'payment' ? 'Bank transfer' : b.kind === 'fee' ? 'Fee' : 'Regular') }); });
  rows.push({ key: 'virtual|vat', pk: 'VAT SET-ASIDE', acc: 'oneholidays', payee: 'VAT set-aside (Flat Rate)', cat: 'Tax & VAT', kind: 'virtual', months: {}, day: 7, amount: state.settings.vat || 0, kindLabel: 'Set aside monthly', note: state.payeeNote['VAT SET-ASIDE'] || 'Pay HMRC quarterly from One Holidays', virtual: true, confirmed: true });
  return rows.sort((a, b) => a.day - b.day || b.amount - a.amount);
}

/* ---------------- insights ---------------- */
function insights(ym) {
  const s = summary(ym); const out = [];
  const add = (lvl, text) => out.push({ lvl, text });
  if (s.spare < 0) add('bad', `Outgoings exceeded income by ${gbp(-s.spare)} in ${monthLabel(ym)} (after the ${gbp(s.vat)} VAT set-aside). That gap is being carried on cards, Zilch and Clearpay.`);
  else add('good', `${gbp(s.spare)} spare in ${monthLabel(ym)} after fixed costs, everyday spend, one-offs and the VAT set-aside.`);
  if (s.income < s.expected - 1) add('warn', `Income received ${gbp(s.income)} against the expected ${gbp(s.expected)} (ORN ${gbp(state.settings.incomeThinc, { dp: 0 })} + Itravelmix ${gbp(state.settings.incomeOneHolidays, { dp: 0 })}). Check timing of the payments that are missing.`);
  if (s.bnpl > 0) add(s.bnpl > 800 ? 'bad' : 'warn', `Zilch and Clearpay instalments took ${gbp(s.bnpl)}. These are past purchases still being paid off; freezing new BNPL purchases frees this up within two months.`);
  const interest = -s.tx.filter(t => /INTEREST/i.test(t.p) && t.v < 0).reduce((a, t) => a + t.v, 0);
  if (interest > 0) add('bad', `${gbp(interest)} went on credit card interest (Capital One at 34% and Zable at 35% APR). Clearing the Capital One balance first saves the most.`);
  const anth = -s.tx.filter(t => /ANTHROPIC/i.test(t.p)).reduce((a, t) => a + t.v, 0);
  if (anth > 100) add('warn', `Anthropic (Claude) charges came to ${gbp(anth)} across ${s.tx.filter(t => /ANTHROPIC/i.test(t.p)).length} payments. Check whether API usage can move to one plan.`);
  if (s.optional > 0) add('good', `${gbp(s.optional)} of ${monthLabel(ym)}'s spending is marked Optional (beauty, clothing, eating out, subscriptions). That is the headroom for next month; use Need = Essential/Optional on any line to refine it.`);
  const eat = (s.byCat['Eating Out & Takeaway'] || 0) + (s.byCat['Lunch & Coffee'] || 0);
  if (eat > 250) add('warn', `Eating out, takeaways, lunches and coffees came to ${gbp(eat)}. Halving this is the easiest saving in the month.`);
  const fines = s.byCat['Parking Fines & Penalties'] || 0;
  if (fines > 0) add('warn', `${gbp(fines)} on parking charges, PCNs and enforcement (Marston, Westminster, Hillingdon). Avoidable with a parking app set up on both phones.`);
  const subs = (s.byCat['TV & Subscriptions'] || 0) + (s.byCat['Business Software & Tools'] || 0);
  if (subs > 150) add('warn', `Subscriptions and software came to ${gbp(subs)}. Review duplicates (two Experian, two Microsoft, Spotify, Sky, Prime, Google One).`);
  const uncat = s.tx.filter(t => t.cat === 'To categorise').length;
  if (uncat) add('warn', `${uncat} transaction${uncat > 1 ? 's' : ''} still need a category. Open Transactions → To categorise.`);
  const unex = s.tx.filter(t => t.cat === 'Money in – unexplained');
  for (const t of unex) add('warn', `${gbp(t.v)} came into ${accName(t.a)} from ${t.p} on ${shortDate(t.d)} and is left out of income until you confirm what it was (set its category to Income if it should count).`);
  const pend = allAccounts().filter(a => a.pending && !a.balanceOnly).map(a => a.name);
  if (pend.length) add('warn', `No statement yet for ${pend.join(' and ')}, so the household total is understated.`);
  return out;
}

async function createClaim(sel, from) {

}

/* ---------------- savings targets ---------------- */
function goalSaved(g) {
  const manual = r2((g.contribs || []).reduce((x, c) => x + c.amount, 0));

  return r2(manual + matched + (g.opening || 0));
}
function monthsUntil(by) { const now = new Date(); const d = new Date(by + 'T00:00:00'); return Math.max(1, Math.round((d - now) / (1000 * 60 * 60 * 24 * 30.44))); }
function goalMonthly() { return (state.goals || []).map(g => { const saved = goalSaved(g); const left = Math.max(0, r2(g.target - saved)); return { id: g.id, acc: g.acc || 'virgin_savings', monthly: g.monthly != null ? g.monthly : r2(left / monthsUntil(g.by)), left, saved }; }); }

async function deliverFile(name, data) {
  const msg = $('#exportMsg');
  if (downloadsCap) { try { await downloadsCap.save({ filename: name, data }); if (msg) msg.textContent = 'Saved ' + name; return; } catch (e) { if (e && e.code === 'declined') { if (msg) msg.textContent = 'Download cancelled'; return; } } }
  try { const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); if (msg) msg.textContent = 'Download started (if nothing happened, open the app in Safari or Chrome and try again)'; } catch (e) { if (msg) msg.textContent = 'Download not available in this view'; }
}

/* ---- Excel export (minimal .xlsx writer, Aptos 12) ---- */
async function exportExcel() {
  if (typeof JSZip === 'undefined') { toast('Excel export needs an internet connection'); return; }
  const sheets = [];
  const ms = months(); const ym = view.month;
  const s = summary(ym);
  sheets.push(['Summary ' + monthLabel(ym), [
    ['MoneyHub – The Kawa Family', monthLabel(ym)], [],
    ['Income received', s.income], ['Income (one-off)', s.incomeOne], ['Expected income', s.expected], [],
    ['Fixed costs', s.fixed], ['VAT set-aside', s.vat], ['Zilch / Clearpay', s.bnpl], ['Everyday spend', s.variable], ['One-off payments', s.oneoffs], ['Total outgoings', s.out], [],
    [s.spare < 0 ? 'Shortfall' : 'Spare income', s.spare], [],
    ['Spend by category'], ...Object.entries(s.byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => [c, v]), [],
    ['Spend by account'], ...Object.entries(s.byAcc).map(([a, v]) => [accName(a), v]),
  ]]);
  const reg = fixedRegister();
  sheets.push(['Fixed costs', [['Day', 'Payee', 'Type', 'Account', 'Category', ...ms.map(monthLabel), 'Monthly', 'Note'], ...reg.map(r => [r.day, r.payee, r.kindLabel, accName(r.acc), r.cat, ...ms.map(m => r.months[m] || (r.virtual ? r.amount : '')), r.amount, r.note || '']), ['', '', '', '', '', ...ms.map(() => ''), r2(reg.reduce((a, r) => a + r.amount, 0)), '']]]);
  for (const a of allAccounts()) {
    const rows = allTx().filter(t => t.a === a.id);
    if (!rows.length) continue;
    sheets.push([a.name.slice(0, 31), [['Date', 'Payee', 'Reference', 'Bank type', 'Category', 'Type', 'Need', 'Work expense', 'Claim from', 'Action', 'Note', 'Amount'], ...rows.map(t => [t.d, t.p, t.r || '', t.k, t.cat, (TYPES.find(x => x[0] === t.type) || [])[1] || '', t.v < 0 ? (t.ess ? 'Essential' : 'Optional') : '', t.exp ? 'Yes' : '', t.exp ? t.claimFrom : '', t.action ? (t.action.kind === 'cancel' ? 'Cancel' : 'Switch to ' + accName(t.action.to)) : '', t.note || '', t.v])]]);
  }
  await writeXlsx(`MoneyHub ${ym}.xlsx`, sheets, {});
}
async function writeXlsx(filename, sheets, opts) {

  const sheetXml = rows => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="2" width="30" customWidth="1"/><col min="3" max="12" width="18" customWidth="1"/></cols><sheetData>${rows.map((r, i) => `<row r="${i + 1}">${r.map((v, j) => { const ref = colName(j) + (i + 1); if (v === '' || v == null) return ''; if (typeof v === 'number') return `<c r="${ref}" s="1"><v>${v}</v></c>`; return `<c r="${ref}" t="inlineStr" s="${i === boldRow ? 2 : 0}"><is><t>${xmlEsc(v)}</t></is></c>`; }).join('')}</row>`).join('')}</sheetData></worksheet>`;
  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`);
  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  zip.file('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((sh, i) => `<sheet name="${xmlEsc(sh[0].replace(/[\[\]\*\?\/\\:]/g, ' '))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`);
  zip.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  zip.file('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;£&quot;#,##0.00;[Red]-&quot;£&quot;#,##0.00"/></numFmts><fonts count="2"><font><sz val="12"/><name val="Aptos"/></font><font><b/><sz val="12"/><name val="Aptos"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`);
  sheets.forEach((sh, i) => zip.file(`xl/worksheets/sheet${i + 1}.xml`, sheetXml(sh[1])));
  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  await deliverFile(filename, blob);
}
function colName(j) { let s = ''; j++; while (j > 0) { const m = (j - 1) % 26; s = String.fromCharCode(65 + m) + s; j = Math.floor((j - 1) / 26); } return s; }
